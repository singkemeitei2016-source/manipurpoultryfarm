<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manipur Poultry Farm - Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#198754,#20c997);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
}

.login-box{
    width:420px;
    background:white;
    border-radius:15px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    font-size:70px;
    text-align:center;
}

.title{
    text-align:center;
    font-weight:bold;
    color:#198754;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.btn-success{
    height:50px;
    font-size:18px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🐔
</div>

<h3 class="title">
Manipur Poultry Farm
</h3>

<div class="subtitle">
Administrator Login
</div>

<div id="msg"></div>

<div class="mb-3">
<label class="form-label">Username</label>
<input
type="text"
id="username"
class="form-control"
placeholder="Enter Username">
</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password">

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword()">
👁
</button>

</div>

</div>

<button
class="btn btn-success w-100"
onclick="loginAdmin()">
Login
</button>

<div class="footer">

Version 1.0<br>

© 2026 Manipur Poultry Farm

</div>

</div>

<script>

function togglePassword(){

let p=document.getElementById("password");

p.type=(p.type==="password")?"text":"password";

}

function loginAdmin(){

let u=document.getElementById("username").value.trim();

let p=document.getElementById("password").value.trim();

let msg=document.getElementById("msg");

if(u==="" || p===""){

msg.innerHTML=`
<div class="alert alert-warning">
Please enter username and password.
</div>
`;

return;

}

/* Temporary Login */

if(u==="admin" && p==="admin@123"){

localStorage.setItem("adminLogin","true");

window.location.href="dashboard.html";

}
else{

msg.innerHTML=`
<div class="alert alert-danger">
Invalid Username or Password.
</div>
`;

}

}

</script>

</body>
</html>
